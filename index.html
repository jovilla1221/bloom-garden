<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bloom Garden — Lily & Peony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --accent:#d98ab0;
      --glass:rgba(50,28,45,0.42);
      --glass-border:rgba(255,220,235,0.18);
      --text:#fff4f7;
      --font-main:'Outfit',sans-serif;
      --font-script:'Great Vibes',cursive;
    }
    *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
    html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font-main);background:#1a0510;color:var(--text);}
    body{
      background:
        radial-gradient(circle at 50% 80%, rgba(255,190,215,0.28) 0%, rgba(255,150,185,0.16) 30%, transparent 62%),
        radial-gradient(circle at 15% 30%, rgba(235,180,255,0.16) 0%, transparent 55%),
        radial-gradient(circle at 85% 20%, rgba(255,215,240,0.12) 0%, transparent 50%),
        linear-gradient(to top, #26081c 0%, #1c0620 40%, #140322 72%, #0e021f 100%);
    }
    #gardenCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;cursor:crosshair;touch-action:none;}

    #startOverlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:rgba(20,4,16,.55);backdrop-filter:blur(6px);text-align:center;padding:2rem;transition:opacity .5s ease;}
    #startOverlay.hidden{opacity:0;pointer-events:none;}
    #startOverlay h1{font-family:var(--font-script);font-size:clamp(2.4rem,7vw,3.8rem);color:#ffe8f2;text-shadow:0 0 26px rgba(255,150,195,.55);margin:0;}
    #startOverlay p{font-size:.9rem;color:#f3cfdf;max-width:380px;margin:0;}
    #startBtn{margin-top:.6rem;padding:.9rem 2.2rem;border:none;border-radius:40px;font-family:var(--font-main);font-weight:600;font-size:1rem;color:#fff;background:linear-gradient(135deg,#d98ab0,#c96fa0);cursor:pointer;box-shadow:0 8px 30px rgba(217,138,176,.5);transition:transform .2s ease;}
    #startBtn:active{transform:scale(.98);}

    .brand-chip{position:fixed;top:1rem;left:1rem;z-index:15;display:flex;align-items:center;gap:.5rem;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);padding:.45rem .9rem;border-radius:30px;box-shadow:0 4px 20px rgba(0,0,0,.35);pointer-events:none;}
    .brand-chip .icon{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#e8a2c4,#c96fa0);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff;box-shadow:0 4px 12px rgba(217,138,176,.4);}
    .brand-chip h1{font-family:var(--font-script);font-size:1.3rem;font-weight:500;background:linear-gradient(90deg,#fff6f0,#ffd9e8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}

    #musicToggle{position:fixed;top:1rem;right:1rem;z-index:50;width:44px;height:44px;border-radius:50%;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;box-shadow:0 4px 20px rgba(0,0,0,.35);transition:all .3s ease;}
    #musicToggle:hover{background:rgba(217,138,176,.3);transform:scale(1.05);}
    #musicToggle.muted{color:#ff7a9e;}

    .cmd-bar{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:.5rem;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-border);padding:.5rem .7rem;border-radius:40px;box-shadow:0 8px 30px rgba(0,0,0,.45);}
    .cmd-btn{display:flex;align-items:center;gap:.45rem;background:rgba(255,255,255,.07);border:1px solid var(--glass-border);color:var(--text);padding:.55rem 1rem;border-radius:30px;font-family:var(--font-main);font-size:.8rem;font-weight:500;cursor:pointer;transition:all .25s ease;white-space:nowrap;}
    .cmd-btn:hover{background:rgba(255,255,255,.18);transform:translateY(-2px);}
    .cmd-btn:active{transform:scale(.96);}
    .cmd-btn.on{background:linear-gradient(135deg,rgba(217,138,176,.45),rgba(201,111,160,.4));border-color:var(--accent);box-shadow:0 0 14px rgba(255,130,170,.35);}

    @media (max-width:480px){
      .cmd-bar{bottom:.8rem;gap:.35rem;padding:.4rem .5rem;}
      .cmd-btn{padding:.5rem .75rem;font-size:.72rem;}
      .cmd-btn i{margin-right:2px;}
      .cmd-btn span{display:none;}
      .brand-chip{padding:.4rem .7rem;}
      .brand-chip h1{font-size:1.1rem;}
    }
  </style>
</head>
<body>
  <canvas id="gardenCanvas"></canvas>

  <div id="startOverlay">
    <h1>Bloom Garden</h1>
    <p>Sentuh layar — bunga lily &amp; peony tumbuh pelan-pelan. Lagu <b>Bloom</b> nyala otomatis.</p>
    <button id="startBtn">🌷 Mulai</button>
  </div>

  <div class="brand-chip">
    <div class="icon"><i class="fa-solid fa-spa"></i></div>
    <h1>Bloom Garden</h1>
  </div>

  <button id="musicToggle" title="Play/Pause Bloom"><i class="fa-solid fa-volume-high"></i></button>

  <div class="cmd-bar">
    <button id="btnClear" class="cmd-btn" title="Hapus semua bunga"><i class="fa-solid fa-eraser"></i><span>Hapus</span></button>
    <button id="btnAuto" class="cmd-btn" title="Tumbuh otomatis"><i class="fa-solid fa-wand-magic-sparkles"></i><span>Otomatis</span></button>
    <button id="btnShot" class="cmd-btn" title="Simpan screenshot"><i class="fa-solid fa-camera"></i><span>Screenshot</span></button>
  </div>

  <audio id="bgMusic" src="music/bloom.mp3" loop preload="auto"></audio>

  <script src="js/audio.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/flower.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
